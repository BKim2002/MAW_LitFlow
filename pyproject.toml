[project]
name = "litflow"
version = "0.1.0"
description = "Local multi-agent literature search workflow with public scholarly connectors."
requires-python = ">=3.10"
dependencies = [
  "openpyxl",
  "python-docx",
  "pydantic",
  "pypdf",
]

[project.optional-dependencies]
agents = ["openai-agents"]
notion = ["notion-client"]
pdf = ["pypdf"]
all = ["openai-agents", "notion-client", "pypdf"]

[tool.setuptools.packages.find]
include = ["litflow*"]
exclude = ["work*", "outputs*", "tests*"]

[tool.litflow]
default_language = "ko"
